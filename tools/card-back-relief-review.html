<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡背浮雕对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151b1e;color:#e3d7bd;font:14px/1.5 system-ui,sans-serif}header{padding:18px 24px 12px}h1{margin:0 0 6px;font-size:22px}p{margin:4px 0;color:#b8b3a6}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px}button{background:#343c3c;color:#ebd9ac;border:1px solid #77694c;padding:6px 14px;cursor:pointer}main{position:relative;margin:0 16px 16px}#views{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;z-index:1;pointer-events:none}.view{height:235px;border:1px solid #465050;background:transparent}.label{padding:7px 10px;color:#d5c5a5;background:#1a2225}canvas{position:absolute;inset:0;width:100%;height:100%}#status{font-size:12px;color:#a8c3b5}@media(max-width:700px){#views{grid-template-columns:repeat(2,minmax(0,1fr))}.view{height:210px}}
</style>
<header><h1>卡背浮雕材质对照</h1><p>每列为一种卡背。三行依次对照：原始平面、受光但无浮雕、受光并带浮雕。</p><div class="controls"><button id="light">切换光照方向</button><label>浮雕强度 <input id="strength" type="range" min="0" max="15" step="0.1" value="8.5"> <output id="value">8.50</output></label><span id="status">正在加载卡背与法线…</span></div></header>
<main><div id="views"></div></main>
<script type="module">
import * as THREE from 'three'
import { BoardTextures } from '/src/render/board-textures.js'
import { createCardFaceMaterial, cardBodyGeometry } from '/src/render/card-body.js'
const textures = new BoardTextures()
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true })
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0x1a2225)
document.querySelector('main').appendChild(renderer.domElement)
const kinds=['neutral','scorch','wither','drown','blocked'], names=['中性','红色','黄色','蓝色','不可翻开']
const rows=['原始平面','受光 · 无浮雕','受光 · 浮雕'], views=[], reliefs=[], lights=[]
let reversed=false
for(let row=0;row<3;row++)for(let col=0;col<5;col++){
  const element=document.createElement('div');element.className='view'
  element.innerHTML='<div class="label">'+names[col]+' / '+rows[row]+'</div>';document.querySelector('#views').appendChild(element)
  const scene=new THREE.Scene(), kind=kinds[col], map=textures.back(kind,kind==='blocked'), normal=textures.backNormal(map)
  const material=row===0?createCardFaceMaterial(map):createCardFaceMaterial(map,normal)
  if(row===1)material.normalMap=null
  if(row===2)reliefs.push(material)
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.rotation.x=-Math.PI/2;mesh.position.y=.071;scene.add(mesh)
  const body=new THREE.Mesh(cardBodyGeometry(1,.12),new THREE.MeshStandardMaterial({map,color:0xb2a58d,roughness:.9}));scene.add(body)
  scene.add(new THREE.HemisphereLight(0xd5e8ff,0x162133,1.3))
  const key=new THREE.DirectionalLight(0xfff0dc,1.5);key.position.set(5,10,6);scene.add(key);lights.push(key)
  const camera=new THREE.OrthographicCamera(-.72,.72,.58,-.58,.1,30);camera.position.set(0,5,5/Math.tan(40*Math.PI/180));camera.lookAt(0,0,0)
  views.push({element,scene,camera})
}
function render(){
  const main=document.querySelector('main'), bounds=main.getBoundingClientRect(), width=Math.round(bounds.width),height=Math.round(bounds.height)
  renderer.setSize(width,height,false);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true)
  for(const {element,scene,camera} of views){
    const rect=element.getBoundingClientRect(),w=rect.width-2,h=rect.height-36,x=rect.left-bounds.left+1,y=height-(rect.bottom-bounds.top)+1
    const aspect=w/h;camera.left=-.64*aspect;camera.right=.64*aspect;camera.top=.64;camera.bottom=-.64;camera.updateProjectionMatrix()
    renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(scene,camera)
  }
}
document.querySelector('#light').onclick=()=>{reversed=!reversed;lights.forEach(light=>light.position.set(reversed?-5:5,10,reversed?-6:6));render()}
document.querySelector('#strength').oninput=event=>{const value=Number(event.target.value);reliefs.forEach(material=>material.normalScale.setScalar(value));document.querySelector('#value').value=value.toFixed(2);render()}
window.addEventListener('resize',render)
await textures.ready
render();document.querySelector('#status').textContent='五种卡背已加载 · 与游戏使用相同材质和主光'
window.cardReliefReview={renderer,textures,views,render,ready:true}
</script></html>
